<title>Kard Reel Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: two-column edit bay — phone-shaped player pinned left, scene timeline right; stacks on phones. */
:root{
  --bg:#f3f1f6; --panel:#ffffff; --ink:#16131f; --muted:#6b6579; --line:#e2dde9;
  --accent:#e0337f; --gold:#b98a00; --gold-bg:#fff4cc; --live:#e0337f1a; --ok:#1d8a52;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#110f17; --panel:#1b1824; --ink:#f2eff7; --muted:#9a93a9; --line:#2c2838;
  --accent:#ff5caa; --gold:#ffd84d; --gold-bg:#3a3110; --live:#ff5caa22; --ok:#43c983; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#110f17; --panel:#1b1824; --ink:#f2eff7; --muted:#9a93a9; --line:#2c2838;
  --accent:#ff5caa; --gold:#ffd84d; --gold-bg:#3a3110; --live:#ff5caa22; --ok:#43c983; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:20px 48px}
.wrap{max-width:1180px; margin:0 auto; display:grid; gap:20px}
header{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 20px}
h1{font-family:var(--display); font-weight:900; font-size:clamp(22px,3vw,30px); letter-spacing:-.01em; margin:0; text-wrap:balance}
.meta{font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.02em}

.bay{display:grid; grid-template-columns:minmax(260px,340px) minmax(0,1fr); gap:24px; align-items:start}
.bay > *{min-width:0}
@media (max-width:820px){ .bay{grid-template-columns:minmax(0,1fr)} }

.player{position:sticky; top:calc(env(safe-area-inset-top,0px) + 12px); display:grid; grid-template-columns:minmax(0,1fr); gap:10px; min-width:0; width:100%}
@media (max-width:820px){ .player{position:static; max-width:380px; margin:0 auto; width:100%} }
video{width:100%; max-width:100%; min-width:0; height:auto; max-height:calc(100vh - 220px); aspect-ratio:9/16; object-fit:contain; background:#000; border-radius:14px; display:block; justify-self:center}
.controls{display:flex; align-items:center; gap:8px}
button{font:inherit; cursor:pointer}
.btn{font-weight:700; font-size:14px; padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--ink)}
.btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn:focus-visible, .scene:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
input[type=range]{flex:1; min-width:0; accent-color:var(--accent)}
.tc{font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums; color:var(--muted); white-space:nowrap}

.decisions{background:var(--gold-bg); border-radius:12px; padding:12px 14px; display:grid; gap:4px}
.decisions h2{font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin:0; color:var(--gold)}
.decisions ul{margin:0; padding-left:18px; font-size:14px}

.timeline{display:grid; gap:10px; min-width:0}
.tl-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px}
.tl-head h2{font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:0}

.scene{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:grid;
  grid-template-columns:72px minmax(0,1fr); gap:4px 14px; transition:background .15s, border-color .15s}
.scene.active{border-color:var(--accent); background:linear-gradient(var(--live),var(--live)), var(--panel)}
.jump{grid-row:1 / span 2; align-self:start; background:none; border:0; padding:0; text-align:left; color:var(--ink)}
.jump .t{font-family:var(--mono); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; display:block}
.jump .d{font-family:var(--mono); font-size:11px; color:var(--muted)}
.jump:hover .t{color:var(--accent)}
.title{font-family:var(--display); font-weight:800; font-size:16px; margin:0}
.rows{display:grid; gap:6px; font-size:14px; min-width:0}
.row{display:grid; grid-template-columns:70px minmax(0,1fr); gap:8px}
.k{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding-top:2px}
.vo{font-weight:600}
.note{grid-column:2; margin-top:6px}
.note textarea{width:100%; min-height:38px; resize:vertical; font:inherit; font-size:14px; padding:8px 10px; border-radius:8px;
  border:1px dashed var(--line); background:transparent; color:var(--ink)}
.note textarea:not(:placeholder-shown){border-style:solid; border-color:var(--accent)}
@media (max-width:480px){ .scene{grid-template-columns:minmax(0,1fr)} .jump{grid-row:auto} .note{grid-column:1} .row{grid-template-columns:minmax(0,1fr)} }

.export{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:grid; gap:8px}
.export pre{margin:0; white-space:pre-wrap; word-break:break-word; font-family:var(--mono); font-size:12.5px; color:var(--ink);
  background:var(--bg); border-radius:8px; padding:10px 12px; min-height:44px}
.status{font-size:13px; color:var(--ok); min-height:1.2em}
@media (prefers-reduced-motion: reduce){ .scene{transition:none} }
</style>

<div class="wrap">
  <header>
    <h1 id="ttl">Kard Avenue Reel</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="bay">
    <section class="player" aria-label="Video player">
      <video id="vid" src="video.mp4" playsinline preload="metadata"></video>
      <div class="controls">
        <button class="btn primary" id="play" type="button">Play</button>
        <button class="btn" id="restart" type="button">Restart</button>
        <input type="range" id="scrub" min="0" max="60" step="0.05" value="0" aria-label="Seek">
        <span class="tc" id="clock">0:00.0</span>
      </div>
      <div class="decisions" id="dec" hidden>
        <h2>Open decisions</h2>
        <ul id="declist"></ul>
      </div>
    </section>

    <section class="timeline" aria-label="Scenes">
      <div class="tl-head">
        <h2>Scenes · click a time to jump</h2>
        <span class="tc">Notes save in this browser</span>
      </div>
      <div id="scenes" class="timeline"></div>

      <div class="export">
        <div class="tl-head">
          <h2>Your edit notes</h2>
          <button class="btn primary" id="copy" type="button">Copy notes for Claude</button>
        </div>
        <pre id="out">No notes yet. Type in any scene's note box.</pre>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
    </section>
  </div>
</div>

<script>
function boot(DATA){
const SCENES = DATA.scenes;
document.getElementById('ttl').textContent = DATA.title; document.title = DATA.title;
document.getElementById('meta').textContent = '9:16 · ' + DATA.length + 's · Bahasa VO + EN captions · Instagram Reels';
document.getElementById('scrub').max = DATA.length;
if (DATA.open && DATA.open.length){ document.getElementById('dec').hidden = false;
  DATA.open.forEach(x => { const li = document.createElement('li'); li.textContent = x; document.getElementById('declist').appendChild(li); }); }


const KEY = 'kard-reel-notes-' + DATA.title;
let notes = {};
try { notes = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) { notes = {}; }

const fmt = s => { const m = Math.floor(s/60), r = s - m*60; return m + ':' + r.toFixed(1).padStart(4,'0'); };
const fmt0 = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');

const list = document.getElementById('scenes');
SCENES.forEach((s, i) => {
  const el = document.createElement('article');
  el.className = 'scene'; el.dataset.i = i;
  el.innerHTML = `
    <button class="jump" type="button" aria-label="Jump to ${fmt0(s.t)}"><span class="t">${fmt0(s.t)}</span><span class="d">${(s.e - s.t).toFixed(1)}s</span></button>
    <h3 class="title">${i+1}. ${s.title}</h3>
    <div class="rows">
      <div class="row"><span class="k">Voice</span><span class="vo"></span></div>
      <div class="row"><span class="k">Caption</span><span class="cap"></span></div>
      <div class="row"><span class="k">Visual</span><span class="vis"></span></div>
      <div class="row"><span class="k">Sound</span><span class="sfx"></span></div>
    </div>
    <div class="note"><textarea id="note-${i}" placeholder="Change request for ${fmt0(s.t)}–${fmt0(s.e)}…" aria-label="Notes for scene ${i+1}"></textarea></div>`;
  el.querySelector('.vo').textContent = s.vo;
  el.querySelector('.cap').textContent = s.cap;
  el.querySelector('.vis').textContent = s.vis;
  el.querySelector('.sfx').textContent = s.sfx;
  const ta = el.querySelector('textarea');
  ta.value = notes[i] || '';
  ta.addEventListener('input', () => { notes[i] = ta.value; save(); renderOut(); });
  el.querySelector('.jump').addEventListener('click', () => { vid.currentTime = s.t + 0.01; vid.play().catch(()=>{}); });
  list.appendChild(el);
});

function save(){ try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch(e) {} }
function exportText(){
  return SCENES.map((s,i) => (notes[i]||'').trim() ? `${fmt0(s.t)}–${fmt0(s.e)} (${s.title}): ${notes[i].trim()}` : null).filter(Boolean).join('\n');
}
function renderOut(){ const t = exportText(); out.textContent = t || 'No notes yet. Type in any scene\'s note box.'; }
const out = document.getElementById('out'); renderOut();

const vid = document.getElementById('vid'), play = document.getElementById('play'), scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
play.addEventListener('click', () => vid.paused ? vid.play().catch(()=>{}) : vid.pause());
document.getElementById('restart').addEventListener('click', () => { vid.currentTime = 0; vid.play().catch(()=>{}); });
vid.addEventListener('play', () => play.textContent = 'Pause');
vid.addEventListener('pause', () => play.textContent = 'Play');
scrub.addEventListener('input', () => { vid.currentTime = +scrub.value; });
let last = -1;
vid.addEventListener('timeupdate', () => {
  const t = vid.currentTime; scrub.value = t; clock.textContent = fmt(t) + ' / ' + fmt0(DATA.length);
  const idx = SCENES.findIndex(s => t >= s.t && t < s.e);
  if (idx !== last) {
    list.querySelectorAll('.scene').forEach(n => n.classList.toggle('active', +n.dataset.i === idx));
    last = idx;
  }
});

document.getElementById('copy').addEventListener('click', () => {
  const t = exportText(), st = document.getElementById('status');
  if (!t) { st.textContent = 'Nothing to copy yet. Add a note to a scene first.'; return; }
  navigator.clipboard.writeText(t).then(() => { st.textContent = 'Copied. Paste it in the chat with Claude.'; })
    .catch(() => { const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r); st.textContent = 'Selected. Copy it with Ctrl/Cmd + C.'; });
});

}
fetch('scenes.json').then(r => r.json()).then(boot).catch(() => { document.getElementById('scenes').textContent = 'Could not load scenes.json'; });
</script>
